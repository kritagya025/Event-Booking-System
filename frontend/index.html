<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%23EA580C'><path d='M2 9a3 3 0 0 1 3-3h14a3 3 0 0 1 3 3v2a2 2 0 0 0 0 4v2a3 3 0 0 1-3 3H5a3 3 0 0 1-3-3v-2a2 2 0 0 0 0-4V9zm8-1v8m4-8v8'/></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Event booking system for concerts, tech conferences, theater shows, and workshops. Real-time seat reservation, coupon discounts, waitlist auto-promotion, and QR code ticketing." />
    <title>EventHub | Real-Time Live Event Ticketing & Seat Reservation Platform</title>
    <!-- Google Fonts & Material Symbols -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Courier+Prime:ital,wght@0,400;0,700;1,400;1,700&family=JetBrains+Mono:wght@500;700;800&family=Oswald:wght@600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Syne:wght@700;800&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">
    
    <!-- Theme Initializer (prevents flash) -->
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('sb-theme') || 'dark';
          if (saved === 'light') {
            document.documentElement.classList.add('light');
            document.documentElement.classList.remove('dark');
          } else {
            document.documentElement.classList.add('dark');
            document.documentElement.classList.remove('light');
          }
        } catch (e) {}
      })();
    </script>

    <!-- Tailwind CSS Script with Brutalist Acid-Zine Extension -->
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              "acid-yellow": "var(--acid-yellow)",
              "acid-yellow-hover": "var(--acid-yellow-hover)",
              "neon-magenta": "var(--neon-magenta)",
              "neon-magenta-dark": "var(--neon-magenta-dark)",
              "electric-cobalt": "var(--electric-cobalt)",
              "asphalt-black": "var(--asphalt-black)",
              "asphalt-surface": "var(--asphalt-surface)",
              "asphalt-card": "var(--asphalt-card)",
              "asphalt-border": "var(--asphalt-border)",
              "grit-white": "var(--grit-white)",
              "grit-dim": "var(--grit-dim)",
              "danger-red": "var(--status-danger)"
            },
            fontFamily: {
              display: ["'Bebas Neue'", "sans-serif"],
              impact: ["'Oswald'", "sans-serif"],
              "mono-zine": ["'Courier Prime'", "monospace"],
              ticker: ["'JetBrains Mono'", "monospace"]
            }
          }
        }
      }
    </script>
    <script>window.global = window;</script>
  </head>
  <body class="bg-asphalt-black font-mono-zine text-grit-white antialiased selection:bg-acid-yellow selection:text-asphalt-black min-h-screen photocopy-grit border-t-4 border-acid-yellow transition-colors duration-150">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
