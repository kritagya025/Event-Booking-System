<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="alternate icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#0e0e11" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Event booking system for concerts, tech conferences, theater shows, and workshops. Real-time seat reservation, coupon discounts, waitlist auto-promotion, and QR code ticketing." />
    <title>EventHub | Real-Time Live Event Ticketing & Seat Reservation Platform</title>

    <!-- Preconnect & High-Performance Typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Courier+Prime:ital,wght@0,400;0,700;1,400;1,700&family=JetBrains+Mono:wght@500;700;800&family=Oswald:wght@600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">
    
    <!-- Theme Initializer (prevents flash) -->
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('sb-theme') || 'dark';
          if (saved === 'light') {
            document.documentElement.classList.add('light');
            document.documentElement.classList.remove('dark');
          } else {
            document.documentElement.classList.add('dark');
            document.documentElement.classList.remove('light');
          }
        } catch (e) {}
      })();
    </script>
    <script>window.global = window;</script>
  </head>
  <body class="bg-asphalt-black font-mono-zine text-grit-white antialiased selection:bg-acid-yellow selection:text-asphalt-black min-h-screen photocopy-grit border-t-4 border-acid-yellow transition-colors duration-150">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
