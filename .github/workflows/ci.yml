name: EventHub CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─────────────────────────────────────────────────────────────
  # 1. Backend Service: Java 17 / Spring Boot Build & Tests
  # ─────────────────────────────────────────────────────────────
  backend:
    name: Backend CI (Spring Boot & Tests)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Make Maven Wrapper Executable
        run: chmod +x ./mvnw

      - name: Run Backend Tests (H2 In-Memory Profile)
        run: ./mvnw -B clean test -Dspring.profiles.active=test

      - name: Build Spring Boot Production JAR
        run: ./mvnw -B package -DskipTests

      - name: Upload Backend Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: eventhub-backend-jar
          path: target/*.jar
          if-no-files-found: error
          retention-days: 7

  # ─────────────────────────────────────────────────────────────
  # 2. Frontend Application: React 19 / Vite / Tailwind
  # ─────────────────────────────────────────────────────────────
  frontend:
    name: Frontend CI (Lint & Vite Production Build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: npm ci

      - name: Run Frontend Linter (Oxlint)
        run: npm run lint

      - name: Build Frontend Production Distribution
        run: npm run build

      - name: Upload Frontend Production Distribution
        uses: actions/upload-artifact@v4
        with:
          name: eventhub-frontend-dist
          path: frontend/dist/
          if-no-files-found: error
          retention-days: 7
