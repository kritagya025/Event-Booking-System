name: Backend CI

on:
  push:
    branches: [ main ]
    paths:
      - 'src/**'
      - 'pom.xml'
      - 'mvnw*'
      - '.mvn/**'
      - '.github/workflows/backend.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'src/**'
      - 'pom.xml'
      - 'mvnw*'
      - '.mvn/**'
      - '.github/workflows/backend.yml'
  workflow_dispatch:

concurrency:
  group: backend-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-build-test:
    name: Spring Boot 3 / Java 17 Test & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Make Maven Wrapper Executable
        run: chmod +x ./mvnw

      - name: Run Backend Tests (H2 In-Memory Profile)
        env:
          SPRING_PROFILES_ACTIVE: test
          DB_URL: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
          DB_USERNAME: sa
          DB_PASSWORD: ""
          DB_DRIVER: org.h2.Driver
          JWT_SECRET: dGhpcyBpcyBhIHRlc3Qgc2VjcmV0IGtleSBmb3IgdGVzdGluZyBwdXJwb3Nlcw==
        run: ./mvnw -B test -Dspring.profiles.active=test

      - name: Build Spring Boot Production JAR
        env:
          SPRING_PROFILES_ACTIVE: test
          DB_URL: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
          DB_USERNAME: sa
          DB_PASSWORD: ""
          DB_DRIVER: org.h2.Driver
          JWT_SECRET: dGhpcyBpcyBhIHRlc3Qgc2VjcmV0IGtleSBmb3IgdGVzdGluZyBwdXJwb3Nlcw==
        run: ./mvnw -B package -DskipTests

      - name: Upload Backend Production JAR Artifact
        uses: actions/upload-artifact@v4
        with:
          name: eventhub-backend-jar
          path: target/*.jar
          if-no-files-found: error
          retention-days: 7
