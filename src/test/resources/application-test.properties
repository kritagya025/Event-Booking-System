spring.application.name=event-booking-system-test

# H2 In-Memory Database for Tests
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# JPA / Hibernate Configuration for Tests
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# JWT Configuration for Tests
jwt.secret=dGhpcyBpcyBhIHRlc3Qgc2VjcmV0IGtleSBmb3IgdGVzdGluZyBwdXJwb3Nlcw==
jwt.expiration=86400000
jwt.refresh-expiration=604800000

# Disable mail for tests
spring.mail.host=localhost
spring.mail.port=25

# Cache: use simple in-memory cache for tests (no Redis required)
spring.cache.type=simple
spring.data.redis.repositories.enabled=false

# Auto-configuration exclusions for tests (Mail, Redis, Redis Repositories)
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.mail.MailAutoConfiguration,org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration,org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration

# Rate Limiting disabled for tests
app.rate-limiting.enabled=false

# Application
app.base-url=http://localhost:8080
app.cors.allowed-origins=http://localhost:3000
app.seat.lock-timeout-minutes=10
app.cookie.secure=false
app.security.csrf.enabled=false
